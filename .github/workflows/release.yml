name: Publish Theme Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(cat VERSION 2>/dev/null || echo "1.1.2")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body: |
            Official release package for RajaSkin Luxury WooCommerce Theme v${{ steps.get_version.outputs.VERSION }}.
            
            ### Installation:
            1. Download `rajaskin-theme.zip` below.
            2. Upload via WordPress Admin: **Appearance → Themes → Add New Theme → Upload Theme**.
            3. Future updates will be notified and installable directly with 1-click in your WordPress Dashboard!
          draft: false
          prerelease: false
          files: rajaskin-theme.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
